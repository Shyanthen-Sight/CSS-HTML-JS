<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{/*标记选择器*/
            color:blue;
        }
        .special{/*类别选择器*/
            color:red;
        }
        p.special{/*标记类别选择器*/
            color:green;
        }
    </style>
</head>
<body>
    <p>what color</p>
    <p class="special">what color</p>
    <h3 class="special">what color</h3>
</body>
</html>
