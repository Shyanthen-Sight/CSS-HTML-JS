<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*nth-of-type(1) 是一个意思。*/
        /*父元素中第一个出现的 <p> 标签*/
        p:first-of-type{/*选择的 p 元素是其父元素的第一个 p 元素：*/
            background: red;
        }
    </style>
</head>
<body>
    <h1>
       <p>nihao</p> 
       <p>nihao</p>
    </h1>
</body>
</html>
