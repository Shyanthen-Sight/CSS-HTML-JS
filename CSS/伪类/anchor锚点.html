<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{text-decoration: underline;}/*这样的话就不用每个a标签下都加decoration*/
        
        a:link{color: red;}/*未访问*/

        a:visited{color: green;}/*访问过了*/

        a:hover{color: blue;}/*上空停悬*/

        a:active{color:purple;}/*激活瞬间*/
    </style>
    <!--link,visited,hover,active存在必要的顺序-->
</head>
<body>
    <a href="#">click me</a>
</body>
</html>
