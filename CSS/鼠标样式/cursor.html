<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鼠标cursor样式大全</title>
<style>
.item {
  padding: 15px 20px;
  margin: 8px 0;
  background: #f5f5f5;
  border-radius: 4px;
}
</style>
</head>
<body>

<div class="item" style="cursor: default;">default — 默认箭头</div>
<div class="item" style="cursor: pointer;">pointer — 小手可点击</div>
<div class="item" style="cursor: text;">text — 文本输入竖线</div>
<div class="item" style="cursor: wait;">wait — 加载等待转圈</div>
<div class="item" style="cursor: help;">help — 问号帮助</div>
<div class="item" style="cursor: move;">move — 可移动十字</div>
<div class="item" style="cursor: not-allowed;">not-allowed — 禁止点击</div>
<div class="item" style="cursor: crosshair;">crosshair — 十字瞄准</div>
<div class="item" style="cursor: grab;">grab — 抓手抓取</div>
<div class="item" style="cursor: grabbing;">grabbing — 正在抓取</div>

</body>
</html>
