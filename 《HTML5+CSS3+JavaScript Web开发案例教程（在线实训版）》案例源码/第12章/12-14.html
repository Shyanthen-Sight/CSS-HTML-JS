<!DOCTYPE html>
<html>
<head>
<title>四舍五入</title>
<script>
//向上舍入
console.log("ceil: " + Math.ceil(-25.6) + " " + Math.ceil(25.6));
//向下舍入
console.log("floor: " + Math.floor(-25.6) + " " + Math.floor(25.6));
//四舍五入
console.log("round: " + Math.round(-25.6) + " " + Math.round(25.6));
</script>

</head>
<body>
</body>
</html>
