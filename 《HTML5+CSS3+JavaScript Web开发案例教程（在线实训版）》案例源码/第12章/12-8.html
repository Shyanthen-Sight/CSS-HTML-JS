<!DOCTYPE html>
<html>
<head>
<title>比较两个对象</title>
</head>

<body>
<script>

let obj1 = {name: "Tom"};
let obj2 = {name: "Tom"};
let obj3 = obj1
console.log(obj1 == obj2)  // return false
console.log(obj1 === obj2)  // return false
console.log(obj1 == obj3)  // return true
console.log(obj1 === obj3)  // return true

</script>
</body>
</html>
