<!DOCTYPE html>
<html>
<head>
<title>arguments的函数重载</title>
<script>
function fnAdd(){
	if(arguments.length == 0)
		return;
	else if(arguments.length == 1)
		return arguments[0] + 5;
	else{
		let iSum = 0;
		for(let i=0;i<arguments.length;i++)
			iSum += arguments[i];
		return iSum;
	}
}
console.log(fnAdd(45));
console.log(fnAdd(45,50));
console.log(fnAdd(45,50,55,60));
</script>

</head>
<body>
</body>
</html>
