<!DOCTYPE html>
<html>
<head>
<title>switch语句</title>

</head>
<body>
<script>
	let iWeek = parseInt(prompt("输入1到7之间的整数",""));
	switch(iWeek){
		case 1:
			alert("Monday");
			break;
		case 2:
			alert("Tuesday");
			break;
		case 3:
			alert("Wednesday");
			break;
		case 4:
			alert("Thursday");
			break;
		case 5:
			alert("Friday");
			break;
		case 6:
			alert("Saturday");
			break;
		case 7:
			alert("Sunday");
			break;
		default:
			alert("Error");
	}
</script>

</body>
</html>
