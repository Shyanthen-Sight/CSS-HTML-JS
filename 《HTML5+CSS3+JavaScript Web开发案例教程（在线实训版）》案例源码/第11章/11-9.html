<!DOCTYPE html>
<html>
<head>
<title>continue语句</title>

</head>
<body>
<script>
	let aNumbers = new Array();
	let sMessage = "你输入了: \n";
	let iTotal = 0;
	let vUserInput;
	let iArrayIndex = 0;
	do{
		vUserInput = Number(prompt("输入一个数字，或者'0'退出","0"));
		if(isNaN(vUserInput)){
			alert("输入错误，请输入数字，'0'退出");
			continue;		//输入错误则退出当前循环，继续下一次循环
		}
		aNumbers[iArrayIndex] = vUserInput;
		iArrayIndex++;
	}while(vUserInput != 0)		//当输入为0（默认值）时退出循环体
	//for循环遍历数组的常用方法：
	for(let i=0;i<aNumbers.length;i++){
		iTotal += Number(aNumbers[i]);
		sMessage += aNumbers[i] + "\n";
	}
	sMessage += "总数:" + iTotal;
	alert(sMessage);
	
</script>
</body>
</html>
