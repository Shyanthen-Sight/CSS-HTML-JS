<!DOCTYPE html>
<html>
<head>
<title>do..while语句</title>

</head>
<body>
<script>
let aNumbers = new Array();
let sMessage = "你输入了:\n";
let iTotal = 0;
let vUserInput;
let iArrayIndex = 0;
do{
	vUserInput = prompt("输入一个数字，或者'0'退出","0");
	aNumbers[iArrayIndex] = vUserInput;
	iArrayIndex++;
	iTotal += Number(vUserInput);
	sMessage += vUserInput + "\n";
}while(vUserInput != 0)		//当输入为0（默认值）时退出循环体
sMessage += "总数:" + iTotal;
alert(sMessage);

</script>
</body>
</html>
