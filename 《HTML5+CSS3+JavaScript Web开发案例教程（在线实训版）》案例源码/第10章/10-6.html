<!DOCTYPE html>
<html>
<head>
<title>indexOf()和lastIndexOf()的运用</title>
<script>
let myString = "hello world";
console.log(myString.indexOf("l"));     //从前往后
console.log(myString.indexOf("l",3));   //可选参数，从第几个字符开始往后找
console.log(myString.lastIndexOf("l")); //从后往前
console.log(myString.lastIndexOf("l",3)); //可选参数，从第几个字符开始往前找
console.log(myString.lastIndexOf("V"));   //大写“V”找不到，返回-1

</script>

</head>
<body>
</body>
</html>
