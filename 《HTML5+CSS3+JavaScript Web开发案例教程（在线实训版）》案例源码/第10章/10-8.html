<!DOCTYPE html>
<html>
<head>
<title>类型转换</title>
<script>
let a = 3;
let b = a + "";
let c = a.toString();
let d = "student" + a;
console.log('a: ' + typeof(a));
console.log('b: ' + typeof(b));
console.log('c: ' + typeof(c));
console.log('d: ' + typeof(d));
</script>

</head>
<body>
</body>
</html>
