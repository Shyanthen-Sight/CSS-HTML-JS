<!DOCTYPE html>
<html>
<head>
<title>join()方法</title>
<script>
let aMap = ["China","USA","Britain"];
console.log(aMap.join());			//无参数，等同于toString()
console.log(aMap.join(""));		//不用连接符
console.log(aMap.join("]["));		//用“][”来连接
console.log(aMap.join("-cc-"));
</script>

</head>
<body>
</body>
</html>
