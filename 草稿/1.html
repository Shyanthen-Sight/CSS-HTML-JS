<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo清单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            padding: 30px;
            background-color: #ffffff;
        }
        .todo-wrap {
            max-width: 1100px;
            border: 1px solid #ddd;
            padding: 24px;
            border-radius: 8px;
        }
        /*顶部输入框*/
        #todo-input {
            width: 100%;
            padding: 14px 12px;
            font-size: 22px;
            border: 2px solid #a0d4f8;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        /*列表项容器*/
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 8px;
            font-size: 24px;
            border-bottom: 1px solid #dddddd;
        }
        .todo-item:hover{
            background-color:#e9e9e9;
        }
        .todo-text{
            display:flex;
            gap:12px;
            align-items:center;
        }
        .del-btn{
            background-color:#ed5543;
            color:white;
            border:none;
            font-size:22px;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        /*底部统计行*/
        .todo-footer{
            display:flex;
            align-items:center;
            gap:12px;
            margin-top:20px;
            font-size: 24px;
            padding: 8px;
        }
        input[type="checkbox"]{
            width:22px;
            height:22px;
        }
    </style>
</head>
<body>
    <div class="todo-wrap">
        <input type="text" id="todo-input" placeholder="输入任务">
        <div id="list-container">
            <div class="todo-item">
                <div class="todo-text">
                    <input type="checkbox">
                    <span>打代码</span>
                </div>
                <button class="del-btn">删除2</button>
            </div>
            <div class="todo-item">
                <div class="todo-text">
                    <input type="checkbox">
                    <span>睡觉</span>
                </div>
                <button class="del-btn"></button>
            </div>
            <div class="todo-item">
                <div class="todo-text">
                    <input type="checkbox">
                    <span>吃饭饭</span>
                </div>
                <button class="del-btn"></button>
            </div>
        </div>
        <div class="todo-footer">
            <input type="checkbox">
            <span>已完成0 / 全部3</span>
        </div>
    </div>

    <script>
        // 删除按钮事件
        document.querySelectorAll('.del-btn').forEach(btn=>{
            btn.onclick = function(){
                this.closest('.todo-item').remove();
            }
        })
    </script>
</body>
</html>
