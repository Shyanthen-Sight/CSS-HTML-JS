<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a[href$=".pdf"] {
            color: red;
        }

        a[href$=".jpg"] {
            color: blue;
        }

        a[href$=".wav"] {
            color: green;
        }

        a::before {
            content: "";
            /* 必须写！ */
            display: inline-block;
            /* 必须写！ */
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: black;
        }               
    
        /* pdf 红圈 */
        a[href$=".pdf"]::before {
            background: red;
        }

        /* jpg 蓝圈 */
        a[href$=".jpg"]::before {
            background: blue;
        }

        /* wav 绿圈 */
        a[href$=".wav"]::before {
            background: green;
        }
    </style>
</head>

<body>
    <a href="file1.pdf">lab report</a><br>
    <a href="file2.jpg">lab picture</a><br>
    <a href="file3.wav">lab audio</a>
</body>
</body>

</html>
