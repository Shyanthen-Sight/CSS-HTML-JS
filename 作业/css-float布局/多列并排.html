<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 30%;
      height: 100px;
      margin: 0 1%;
    }

    .left {
      float: left;
      background: #ff9999;
    }

    .right {
      float: right;
      background: #99ff99;
    }

    .none {
      float: none;
      background-color: #333;
      height: 200px;
      width: 300px;
    }
  </style>
</head>

<body>
  <div class="box left">左浮动</div>
  <div class="box left">左浮动</div>
  <div class="box right">右浮动</div>
  <div class="">不浮动</div>
  <!-- 不浮动盒子不显示 -->
</body>

</html>
