<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 开启滚动 */
    body {
      height: 3000px;
    }

    div {
      width: 200px;
      height: 200px;
      border: 1px solid #333;
      overflow: scroll;
      display: none;
    }
  </style>

</head>

<body>
  <div>
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Totam est velit ducimus rem. Illum dolorum sit commodi
    eligendi deleniti nesciunt in quod, alias aliquid recusandae porro perspiciatis maxime itaque saepe!
  </div>
  <script>
    const div = document.querySelector('div')
    //页面滚动事件
    window.addEventListener('scroll', function () {
      // console.log('scrolled');
      console.log(document.documentElement.scrollTop);
      const n = document.documentElement.scrollTop
      if (n > 100) {
        div.style.display = 'block'
      }else{
        div.style.display = 'none'
      }

    })

    const a = document.querySelector('div')
    a.addEventListener('scroll', function () {
      // console.log('11')
      console.log(a.scrollTop);

    })
  </script>
</body>

</html>
