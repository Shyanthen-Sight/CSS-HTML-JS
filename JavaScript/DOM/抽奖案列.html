<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      background-color: #f2cece;
      text-align: center;
    }
  </style>
</head>

<body>
  <div>
    <strong>抽奖活动</strong>
    <h1>一等奖：<span id="one"></span></h1>
    <h2>二等奖：<span id="two"></span></h2>
    <h3>三等奖：<span id="three"></span></h3>
  </div>
</body>
<script>
  //创建一个姓名数组
  const person = ['xu', 'yuan', 'zhen', 'ni', 'hao', 'ya']

  //先做一等奖
  const random1 = Math.floor(Math.random() * person.length)
  const one = document.querySelector('#one')
  one.innerHTML = person[random1]
  //删除被抽去的人
  person.splice(random1, 1)

  //二等奖
  const random2 = Math.floor(Math.random() * person.length)
  const two = document.querySelector('#two')
  two.innerHTML = person[random2]
  person.splice(random2, 1)

  //三等奖
   const random3 = Math.floor(Math.random() * person.length)
  const three = document.querySelector('#three')
  three.innerHTML = person[random3]
  person.splice(random3, 1)
</script>

</html>
