    const div = document.querySelector('div');
    function getMyDate(){
      const myDate = new Date();
      let h=myDate.getHours();
      let m=myDate.getMinutes();
      let s=myDate.getSeconds();
      h = h < 10 ? '0' + h : h;
      m = m < 10 ? '0' + m : m;
      s = s < 10 ? '0' + s : s;
      return `今天是:${myDate.getFullYear()}年${myDate.getMonth() + 1}月${myDate.getDate()}日 ${myDate.getHours()}时${myDate.getMinutes()}分${myDate.getSeconds()}秒`;
    }
    div.innerHTML = getMyDate();
    setInterval(() => {
      div.innerHTML = getMyDate();
    }, 1000);
