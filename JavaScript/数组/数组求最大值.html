<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let a = [2, 6, 8, 9, 55]
    let max = 0
    let min=a[2]
    for (let i = 0; i < a.length; i++) {
      if (a[i] > max) {
        max = a[i]
      }
      if (a[i] < min) {
        min = a[i]
      }
    }
    document.write(`最大值为${max},最小值为${min}`)
  </script>
</body>

</html>
