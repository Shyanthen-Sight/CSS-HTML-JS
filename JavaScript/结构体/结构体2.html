<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>菜鸟教程(runoob.com)</title>
</head>

<body>

    <p>创建 JavaScript 对象。</p>
    <p id="demo">点击显示</p>
    <script>
        var person =
            { firstName: "John", lastName: "Doe", age: 50, eyeColor: "blue" };
        function change() {
            document.getElementById("demo").innerHTML =
                person.firstName + " 现在 " + person.age + " 岁.";
        }
    </script>
    <button onclick="change()">click</button>
</body>

</html>
