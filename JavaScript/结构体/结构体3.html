<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>有两种方式可以访问对象属性：

        你可以使用 .property 或 ["property"].</p>
            <p id="demo"></p>
    <script>
        var person = {
            name: "xuyuanzhen",
            age: 19,
        };
        document.getElementById("demo").innerHTML = person.name + " is " + person["age"];
    </script>

</body>

</html>
