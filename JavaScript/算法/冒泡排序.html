<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let a = [5, 4, 3, 2, 1]
    let temp
    for (let i = 0; i < a.length - 1; i++) {
      for (let j = 0; j < a.length - i - 1; j++) {
          if(a[j]>a[j+1])
          {
              temp=a[j+1]
              a[j+1]=a[j]
              a[j]=temp
          }
      }
    }
      document.write(a)
  </script>
</body>

</html>
