<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
   .box{
    display: flex;
    width: 700px;
    height: 300px;
    border-left:1px solid #333 ;
    border-bottom:1px solid #333 ;
    margin: auto;
    margin-top: 400px;
    justify-content: space-around;
    align-items: flex-end;
    text-align: center;
   }
   .box>div{
    background-color: #333;
    display: flex;
    width: 50px;
    flex-direction: column;
    justify-content: space-between;
   }
   .box div h4{
    margin-bottom: -35px;
    width: 70px;
    margin-left: -10px;
   }
   .box div span{
    margin-top: -20px;
   }
   body>div:first-child{
    width: 100px;
    height: 100px;
    background-color: #333;
    margin: auto;
    display: flex;
   }
  </style>
</head>
<div>销售额/万</div>
<body>
  <script>
    let a = []
    for (let i = 1; i <= 4; i++) {
      a.push(prompt(`请输入第${i}赛季销售额`))
    }


    document.write(`<div class="box">`)

    for(let i=0;i<4;i++)
    {
      document.write(`
      <div style="height:${a[i]}px">
        <span>${a[i]}</span>
      <h4>第${i+1}赛季</h4>
      </div>
      `)
    }     


    document.write(`</div>`)
  </script>
</body>

</html>
