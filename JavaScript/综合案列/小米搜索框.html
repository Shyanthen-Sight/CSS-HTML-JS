<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>小米搜索下拉</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      list-style: none;
      text-decoration: none;
    }
    .mi {
      width: 200px;
      margin: 50px auto;
      position: relative;
    }
    /* 搜索输入框 */
    .mi input {
      width: 100%;
      height: 40px;
      padding: 0 10px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 14px;
    }
    .mi input:focus{
      border-color: #ff6700;
    }

    /* 下拉结果列表 */
    .result-list {
      width: 100%;
      border: 1px solid #ddd;
      border-top: none;
      position: absolute;
      top: 40px;
      left: 0;
      background: #fff;
      display: none; /* 默认隐藏 */
    }

    /* =========新增关键CSS========= */
    /* 父盒子有active类时，下拉框边框变橙色 */
    .mi.active .result-list {
      border-color: #ff6700;
    }

    .result-list li a {
      display: block;
      height: 36px;
      line-height: 36px;
      padding: 0 10px;
      color: #333;
      font-size: 14px;
    }
    .result-list li a:hover {
      background-color: #f5f5f5;
      color: #ff6700;
    }
  </style>
</head>
<body>
<div class="mi">
  <input type="search" placeholder="小米笔记本" id="searchInput">
  <ul class="result-list" id="resultList">
    <li><a href="#">全部商品</a></li>
    <li><a href="#">小米11</a></li>
    <li><a href="#">小米10S</a></li>
    <li><a href="#">小米笔记本</a></li>
    <li><a href="#">小米手机</a></li>
    <li><a href="#">黑鲨4</a></li>
    <li><a href="#">空调</a></li>
  </ul>
</div>

<script>
  const input = document.querySelector('[type=search]')
  const ul = document.querySelector('.result-list')
  // 获取外层父容器.mi
  const box = document.querySelector('.mi')

  input.addEventListener('focus',function(){
    ul.style.display = 'block'
    // 给父盒子加active类，触发下拉框变色
    box.classList.add('active')
  })

  input.addEventListener('blur',function(){
    ul.style.display = 'none'
    // 失去焦点移除active，边框恢复灰色
    box.classList.remove('active')
  })
</script>
</body>
</html>
