<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>演示界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 顶部导航栏 紫色固定导航 */
        .top-nav {
            position: fixed;
            top: -80px; /* 默认隐藏在页面上方外 */
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #700070;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: top 0.5s ease;
            z-index: 999;
        }
        .top-nav span {
            color: #eee;
            font-size: 32px;
        }

        /* 中间粉色主容器，居中固定宽度 */
        .main-wrap { 
            width: 70%;
            min-height: 2000px;
            margin: 0 auto;
            background-color: #fcced9;
            position: relative;
            padding-top: 80px; /* 预留导航高度，内容不被遮挡 */
        }
        /* 浅蓝色秒杀模块 */
        .seckill-box {
            position: absolute;
            width: 200px;
            height: 300px;
            background-color: #94cced;
            top: 600px;
            left: 20px; /* 替代失效的margin-left */
            display: flex;
            align-items: flex-start;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <span>我是顶部导航栏</span>
    </div>

    <!-- 粉色主体区域 -->
    <div class="main-wrap">
        <!-- 秒杀蓝色模块 -->
        <div class="seckill-box">秒杀模块</div>
    </div>

    <script>
        const topNav = document.querySelector('.top-nav')
        const seckillBox = document.querySelector('.seckill-box')
        // 获取秒杀盒子距离页面顶部的绝对距离
        const boxAbsoluteTop = seckillBox.getBoundingClientRect().top + window.scrollY

        window.addEventListener('scroll', function() {
            const scrollTop = document.documentElement.scrollTop
            // 滚动超过秒杀模块顶部时，导航滑出来
            if (scrollTop >= boxAbsoluteTop) {
                topNav.style.top = '0px'
            } else {
                topNav.style.top = '-80px'
            }
        })
    </script>
</body>
</html>
