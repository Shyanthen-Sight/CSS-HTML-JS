<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #1 {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>this is a content style changing function</h1>
    <script>
        function change() {
            x = document.getElementById("change");//找id元素
            if (x.style.color == "red") {
                x.style.color = "black";
            }
            else {
                x.style.color = "red"
            }


        }
    </script>
    <p id="change">are u ready to change color!</p>
    <button id="1" onclick="change()">click to change color</button>

</html>
