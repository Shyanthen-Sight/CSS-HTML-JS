<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function getrandom(n,m){
      return Math.floor(Math.random()*(m-n+1))+n
    }
    let random=getrandom(1,10)
    let flag=true
   for(let i=1;i<=3;i++)
    { 
      let num=+prompt(`请输入你要猜的数字(1-10)\n现在你还能猜${4-i}次`)
      if(num>random){
        alert('你猜大了')
      }
      if(num<random){
        alert('你猜小了')
      }
      if(num===random){
        flag=false
        alert(`你猜正确了！！答案是${random} `)
        break
      }
  
    }
    if(flag)
    {
      alert('次数已经用完')
    }else{
      alert('程序结束')
    }
  </script>
</body>
</html>
