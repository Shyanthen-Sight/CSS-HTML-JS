<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      display: flex;
    }

    .qs {
      width: 100px;
      height: 20px;
      border: 1px solid #333;
      background-color: #cfcece;
      display: flex;
    }

    .btns button {

      width: 50px;
      height: 30px;
    }
  </style>
</head>

<body>
  <h1>随机点名</h1>
  <div class="box">
    <span>名字是:</span>
    <div class="qs">这里显示名字</div>
  </div>
  <div class="btns">
    <button class="begin">开始</button>
    <button class="over">结束</button>
  </div>
  <script>
    const arr = ['徐追', '可妮', '王刚', '夏丽']
    const qs = document.querySelector('.qs')
    let time_operatiion
    let random
    // 开始按钮
    const begin = document.querySelector('.begin')
    begin.addEventListener('click', function () {
      time_operatiion = setInterval(function () {
        random = parseInt(Math.random() * arr.length)
        qs.innerHTML = arr[random]
      }
        , 20)

        // 如果数组只剩一个值,不需要抽
        if(arr.length===1){
          begin.disabled=over.disabled=true
        }
    })
    // 结束按钮
    const over = document.querySelector('.over')
    over.addEventListener('click', function () {
      clearInterval(time_operatiion)
      // 结束删除
      arr.splice(random, 1)
      
    })
  </script>
</body>

</html>
