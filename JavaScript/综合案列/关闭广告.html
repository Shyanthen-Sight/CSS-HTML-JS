<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .box {
    width: 200px;
    height: 100px;
    border: 1px solid #333;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #eb9c9c;
  }

  .box1 {
    position: absolute;
    width: 10px;
    height: 10px;
    border: 1px solid #333;
    right: 3px;
    top: 3px;
    display: flex;
    font-size: 7px;
    align-items: center;
    justify-content: center;
    background-color: #c2bdbd;
  }
  .box1:hover{
    cursor: pointer;
  }
</style>

<body>
  <div class="box">
    我是广告
    <div class="box1">
      x
    </div>
  </div>
  <script>
    const box1 = document.querySelector('.box1')
    const box = document.querySelector('.box')
    box1.addEventListener('click', function () {
      box.style.display = 'none'
    })
  </script>
</body>

</html>
