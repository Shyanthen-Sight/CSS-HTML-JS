<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table {
      border-collapse: collapse;
      margin: 300px auto;
      width: 600px;
      box-shadow: 0 0 8px #ccc;
    }
    th {
      background-color: #a0c5ea;
      color: #fff;
      padding: 12px;
      border: 1px solid #999;
      font-size: 16px;
    }
    td {
      padding: 10px;
      border: 1px solid #999;
      text-align: center;
      font-size: 15px;
    }
    tr:nth-child(even) {
      background-color: #f5f7fa;
    }
    tr:hover {
      background-color: #e6f7ff;
      cursor: default;
    }
  </style>
</head>

<body>
  <table>
    <thead>
      <tr>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>籍贯</th>
      </tr>
    </thead>
    <!-- 给tbody添加id，方便js获取 -->
    <tbody id="box">

    </tbody>
  </table>
  <script>
    let students = [
      { name: '小明', age: '18', gender: '男', hometown: '河北' },
      { name: '小红', age: '19', gender: '女', hometown: '河南' },
      { name: '小李', age: '15', gender: '男', hometown: '重庆' },
      { name: '小空', age: '15', gender: '男', hometown: '北京' },
    ]
    // 1. 获取tbody容器
    let box = document.getElementById('box');
    // 2. 循环遍历数组
    for (let i = 0; i < students.length; i++) {
      // 3. 取出当前循环的学生对象
      let stu = students[i];
      // 4. 拼接表格行，追加到tbody中
      box.innerHTML += `
        <tr>
          <td>${stu.name}</td>
          <td>${stu.age}</td>
          <td>${stu.gender}</td>
          <td>${stu.hometown}</td>
        </tr>
      `
    }
  </script>
</body>

</html>
