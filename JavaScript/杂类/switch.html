    while (1) {
      let n1 = +prompt('输入第1个数字')
      let n2 = +prompt('输入第2个数字')
      let way = prompt('输入运算符')
      switch (way) {
        case '+': alert(n1 + n2)
          break
        case '-': alert(n1 - n2)
          break
        case '*': alert(n1 * n2)
          break
        case '/': alert(n1 / n2)
          break
        default: alert('wrong input!')

      }
    }

  </script>
