  <script>
    function getmax(a = []) {
      let max = 0
      let min=a[0]
      for (let i = 0; i < a.length; i++) {
        if (a[i] > max) {
          max = a[i]
        }
        if (min>a[i]) {
          min = a[i]
        }
      }
      return [min,max]
    }
    document.write(getmax([1,2,3,4,5]))
