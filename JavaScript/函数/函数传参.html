<body>
  <script>33
  //也是封装函数
    function sum(start,end){
      let sum=0
      for(let i=start;i<=end;i++)
    {
      sum+=i
    }
    document.write(`total is ${sum}`)
    }
    let a=+prompt('input the beginning number')
    let b=+prompt('input the ending number')
    sum(a,b)
  </script>
