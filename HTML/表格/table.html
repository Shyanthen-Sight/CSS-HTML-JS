<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border: 1px solid;
            /* 固定宽度 */
            table-layout: fixed;
            border-radius: 10px;
            border-spacing: 5px;
            font-size: 20px;
            empty-cells: hide;
        }

        th,
        td {
            border: 1px solid;
            border-radius: 10px;
            text-align: center;
        }

        td {
            color: rgb(88, 82, 100);
            background-color: #dfdddd;
        }

        th {
            height: 20px;
            width: 200px;
            background: rgb(162, 197, 231)
        }

        a {
            text-decoration: none;
            color: #333;
        }
        #id{
            width: 20px;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th id="id"><a href="#">ID</a></th>
                <th>PRICE</th>
                <th>APPEARANCE</th>
                <th>COLOR</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>cocla</td>
                <td>12</td>
                <td>red</td>
                <td>red</td>
            </tr>
<tr>
    <td>cocla</td>
<td></td>
<td>red</td>

</tr>
        </tbody>
    </table>
</body>

</html>
