<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body>div:first-child {
            background-color: beige;
            border: solid 2px;
            width: 500px;
        }

        #search {
            border: solid 2px;
            position: relative;
            top: 0px;
            margin: 0px;
            border-top: 0px;
            border-left: 0px;
            border-right: 0px;
        }
    </style>
</head>

<body align="center">
    <div>
        <div>
            <p id="search">调查栏</p>
        </div>
        <p>
            账号：<input type="text" name="account" size="20" placeholder="例：徐源振"><br>
            密码：<input type="text" name="password"><br>
            邮箱：<input type="text" name="email" placeholder="例：15123655146@qq.com">
            姓名：<input type="text" name="name">
        </p>
        <p>
            性别：
            女<input type="radio" name="gender" value="female">
            男<input type="radio" name="gender" value="male">
        </p>
        <p>
            兴趣：
            理科<input type="checkbox" name="interest">
            文科<input type="checkbox" name="interest">
        </p>

        <p> 我要留言：<br><textarea value="留言" rows="5" cols="60"></textarea></p>
        <P>
            <input type="submit" value="确定">
            <input type="reset" value="重置">
        </P>
    </div>
</body>

</html>
